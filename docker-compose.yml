services:
  db:
    image: postgis/postgis:15-3.3
    container_name: rubber_db
    environment:
      POSTGRES_DB: rubber
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: latexsmart2024
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: